---
- name: Update all packages to their latest version
  ansible.builtin.apt:
    name: "*"
    state: present
    update_cache: true

- name: Remove useless packages from the cache
  ansible.builtin.apt:
    autoclean: true

- name: Remove dependencies that are no longer required and purge their configuration files
  ansible.builtin.apt:
    autoremove: true
    purge: true
